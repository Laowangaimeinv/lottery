name: 更新彩票开奖数据

on:
  schedule:
    # 北京时间 22:00（UTC 14:00）：开奖后主抓取（双色球21:15/大乐透21:25开）
    - cron: '0 14 * * *'
    # 北京时间 23:30（UTC 15:30）：兜底再抓一次，防止 runner 排队延误导致漏更
    - cron: '30 15 * * *'
    # 北京时间 次日 06:00（UTC 22:00 前一日）：最终兜底，覆盖官网延迟发布
    - cron: '0 22 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发（首次部署后可立即运行）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取最新开奖并合并
        run: node scripts/fetch.js

      - name: 提交变更（如有）
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: 自动更新彩票开奖数据'
          file_pattern: 'data/lottery.json'
          commit_author: 'lottery-bot <actions@github.com>'
