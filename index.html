<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>彩票开奖 · 走势 · 机选</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="logo">🎯</span>
        <div class="brand-text">
          <h1>彩票开奖助手</h1>
          <span class="tagline">每日开奖 · 走势分析 · 智能机选</span>
        </div>
      </div>
      <div class="updated">数据更新：<span id="updatedAt">加载中…</span></div>
    </div>
    <div class="game-switch" role="tablist" aria-label="选择彩种">
      <button class="game-btn active" data-game="ssq">双色球</button>
      <button class="game-btn" data-game="dlt">大乐透</button>
    </div>
    <nav class="tabs" aria-label="功能切换">
      <button class="tab active" data-tab="latest"><span class="tab-ico">🏆</span>最新开奖</button>
      <button class="tab" data-tab="trend"><span class="tab-ico">📈</span>走势图</button>
      <button class="tab" data-tab="missing"><span class="tab-ico">🔥</span>遗漏</button>
      <button class="tab" data-tab="random"><span class="tab-ico">🎲</span>机选</button>
    </nav>
  </header>

  <main>
    <!-- 最新开奖 -->
    <section id="latest" class="panel active">
      <h2 class="section-title">最新一期开奖</h2>
      <div class="latest-game" role="tablist" aria-label="开奖彩种选择">
        <button class="seg-btn latest-game-btn active" data-game="ssq">双色球</button>
        <button class="seg-btn latest-game-btn" data-game="dlt">大乐透</button>
      </div>
      <div id="latestMain" class="latest-main"></div>
      <h3 class="sub-title">近期开奖</h3>
      <div id="latestList" class="latest-list"></div>
    </section>

    <!-- 走势图 -->
    <section id="trend" class="panel">
      <h2 class="section-title">号码走势图</h2>
      <div class="trend-controls">
        <div class="view-switch" role="tablist" aria-label="走势图视图">
          <button class="view-btn active" data-view="table">基本走势</button>
          <button class="view-btn" data-view="line">折线走势</button>
        </div>
        <label class="range-label">显示期数：
          <select id="trendRange">
            <option value="30">近 30 期</option>
            <option value="50" selected>近 50 期</option>
            <option value="all">全部</option>
          </select>
        </label>
        <label class="link-toggle"><input type="checkbox" id="trendLinks" checked /> 显示连线</label>
      </div>
      <div id="trendTableWrap" class="trend-table-wrap"></div>
      <div id="trendCharts" class="trend-charts" style="display:none"></div>
      <p class="hint">说明：表格为官网同款「基本走势图」。开出的号码以彩球显示，未开出的格内数字为该号码的遗漏期数（即距上次开出隔了多少期）。最新一期显示在最上方。</p>
    </section>

    <!-- 遗漏 -->
    <section id="missing" class="panel">
      <h2 class="section-title">号码遗漏（冷热）</h2>
      <p class="hint">遗漏 = 该号码距上次开出已隔多少期。绿色=热号（近期常出），红色=冷号（很久未出）。</p>
      <div id="missingGrids" class="missing-grids"></div>
    </section>

    <!-- 选号中心 -->
    <section id="random" class="panel">
      <h2 class="section-title">选号中心 · 机选 / 手选</h2>

      <div class="sel-game" role="tablist" aria-label="选择彩种">
        <button class="seg-btn seg-selgame active" data-selgame="ssq">双色球</button>
        <button class="seg-btn seg-selgame" data-selgame="dlt">大乐透</button>
      </div>

      <div class="sel-row">
        <div class="seg" id="inputTypeSeg" role="tablist" aria-label="输入方式">
          <button class="seg-btn active" data-input="auto">🎲 机选</button>
          <button class="seg-btn" data-input="manual">✋ 手选</button>
        </div>
        <div class="seg" id="playSeg" role="tablist" aria-label="玩法">
          <button class="seg-btn active" data-play="single">单式</button>
          <button class="seg-btn" data-play="compound">复式</button>
          <button class="seg-btn" data-play="banker">胆拖</button>
        </div>
      </div>

      <div class="sel-param" id="autoParam">
        <label>生成注数：</label>
        <select id="autoCount">
          <option value="1">1 注</option>
          <option value="3">3 注</option>
          <option value="5" selected>5 注</option>
          <option value="10">10 注</option>
        </select>
        <span class="sel-tip">机选随机生成</span>
      </div>

      <div class="sel-manual" id="manualArea"></div>

      <div class="sel-multi">
        <span class="multi-label">倍数</span>
        <button id="multiMinus" class="step-btn" aria-label="减少倍数">−</button>
        <span id="multiVal" class="multi-val">1</span>
        <button id="multiPlus" class="step-btn" aria-label="增加倍数">+</button>
      </div>

      <div class="sel-actions">
        <button id="genBtn" class="btn-primary">✨ 生成选号</button>
        <button id="resetBtn" class="btn-ghost">清空</button>
      </div>

      <div id="selMsg" class="sel-msg"></div>
      <div id="selPreview" class="sel-preview"></div>

      <div class="sel-save" id="saveArea" style="display:none">
        <div class="save-actions">
          <button id="saveImgBtn" class="btn-primary">📷 保存 / 下载图片</button>
          <button id="copySlipBtn" class="btn-ghost">📋 复制文字</button>
        </div>
        <p class="hint">手机端可<b>长按下方图片</b>保存到相册，再在微信聊天中发送即可分享。</p>
        <div class="slip-img-wrap"><img id="slipImg" class="slip-img" alt="选号单图片" /></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>本工具数据来源于公开接口，仅供娱乐与参考，不构成任何购彩建议。请理性投注，量力而行。</p>
  </footer>

  <script src="./js/app.js" defer></script>
</body>
</html>
